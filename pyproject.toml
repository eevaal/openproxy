[project]
name = "openproxy"
version = "0.3.1"
description = "Privacy-first local network management and monitoring core"
readme = "README.md"
authors = [
    { name = "Ruslan", email = "realnoates@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "h11>=0.16.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
openproxy = "openproxy.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-PyYAML>=6.0.12",
]

[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
